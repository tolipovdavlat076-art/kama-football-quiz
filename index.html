<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAMA Football Quiz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#071b16;color:white;font-family:Arial,sans-serif;text-align:center}
h1{color:#35e58a;font-size:27px}
.card{max-width:470px;margin:18px auto;background:#123329;padding:20px;border-radius:20px}
button{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.main{background:#25dc82;color:#062116}
.answer{background:#245044;color:white}
.answer:disabled{opacity:.75}
.tab{background:#245044;color:white;width:32%;font-size:13px;padding:11px 4px}
.tab.active{background:#25dc82;color:#062116}
#question{font-size:19px;line-height:1.5;margin:22px 0}
#result{min-height:25px;color:#35e58a}
.info{color:#b5d7c9;font-size:14px}
#next,#game,#leaderboard,#finish{display:none}
.timer{font-size:23px;color:#ffd45c;font-weight:bold}
.player{display:flex;justify-content:space-between;background:#245044;padding:12px;margin:7px 0;border-radius:10px}
#questionImage{display:none;width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin:12px auto}
</style>
</head>
<body>

<h1>⚽ KAMA FOOTBALL QUIZ</h1>
<p>Futbol bilimdonlari maydoniga xush kelibsiz!</p>

<div class="card" id="home">
<h2>🏆 Xush kelibsiz!</h2>
<p class="info">10 ta savol • 3 xil qiyinlik • Reyting</p>
<p class="info" id="bankStatus">Savollar yuklanmoqda...</p>
<button class="main" id="startButton" onclick="startGame()" disabled>▶️ O‘YINNI BOSHLASH</button>
<button onclick="showLeaderboard()">🥇 REYTING</button>
</div>

<div class="card" id="game">
<h3 id="progress">1 / 10</h3>
<p id="level" class="info"></p>
<div class="timer">⏱ <span id="time">15</span> soniya</div>
<div id="question"></div>
<img id="questionImage" alt="Savol rasmi">
<div id="answers"></div>
<p id="result"></p>
<p>🏆 Ball: <b id="score">0</b></p>
<button id="next" class="main" onclick="nextQuestion()">Keyingi savol ➜</button>
</div>

<div class="card" id="finish">
<h2>🏆 O‘yin tugadi!</h2>
<h1 id="finalScore">0 ball</h1>
<p id="saveStatus" class="info">Natija saqlanmoqda...</p>
<button class="main" onclick="startGame()">🔄 QAYTA O‘YNASH</button>
<button onclick="showLeaderboard()">🥇 REYTINGNI KO‘RISH</button>
<button onclick="goHome()">Bosh sahifa</button>
</div>

<div class="card" id="leaderboard">
<h2>🥇 O‘YINCHILAR REYTINGI</h2>
<div>
<button class="tab active" id="allTab" onclick="loadBoard('all')">Global</button>
<button class="tab" id="dayTab" onclick="loadBoard('day')">Kunlik</button>
<button class="tab" id="weekTab" onclick="loadBoard('week')">Haftalik</button>
</div>
<div id="players" class="info">Yuklanmoqda...</div>
<button onclick="goHome()">⬅️ Orqaga</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let bank = [];
let questions = [];
let index = 0;
let score = 0;
let timer = null;
let seconds = 15;
let answered = false;

const labels = {
  easy: "Oson",
  medium: "O‘rtacha",
  hard: "Qiyin"
};

function hideAll(){
  ["home","game","finish","leaderboard"].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
}

function goHome(){
  clearInterval(timer);
  hideAll();
  document.getElementById("home").style.display="block";
}

function shuffle(arr){
  const copy = [...arr];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function isImage(q){
  return q.type === "image";
}

function imageUrl(q){
  return q.image || q.image_url || q.imageUrl || "";
}

async function loadQuestions(){
  const status=document.getElementById("bankStatus");
  const button=document.getElementById("startButton");

  try{
    const response=await fetch("/questions.json?time="+Date.now());
    if(!response.ok) throw new Error("Savollar fayli topilmadi");

    const data=await response.json();
    if(!Array.isArray(data) || data.length<10){
      throw new Error("Savollar fayli noto‘g‘ri yoki savollar yetarli emas");
    }

    bank=data.filter(q=>
      q &&
      ["easy","medium","hard"].includes(q.difficulty) &&
      Array.isArray(q.options) &&
      q.options.length===4 &&
      Number.isInteger(q.answer) &&
      q.answer>=0 &&
      q.answer<4 &&
      typeof q.question==="string"
    );

    const easy=bank.filter(q=>q.difficulty==="easy").length;
    const medium=bank.filter(q=>q.difficulty==="medium").length;
    const hard=bank.filter(q=>q.difficulty==="hard").length;

    if(easy<3 || medium<4 || hard<3){
      throw new Error("Oson, o‘rtacha yoki qiyin savollar soni yetarli emas");
    }

    status.textContent="✅ "+bank.length+" ta savol yuklandi";
    button.disabled=false;

  }catch(error){
    status.textContent="⚠️ Savollar yuklanmadi: "+error.message;
    button.disabled=true;
  }
}

function makeGameQuestions(){
  const groups={
    easy:shuffle(bank.filter(q=>q.difficulty==="easy")),
    medium:shuffle(bank.filter(q=>q.difficulty==="medium")),
    hard:shuffle(bank.filter(q=>q.difficulty==="hard"))
  };

  let selected=[
    ...groups.easy.slice(0,3),
    ...groups.medium.slice(0,4),
    ...groups.hard.slice(0,3)
  ];

  // Imkon bo‘lsa, o‘yinda aynan 2 ta rasmli savol bo‘ladi.
  let imageCount=selected.filter(isImage).length;

  if(imageCount<2){
    for(const difficulty of ["easy","medium","hard"]){
      const current=selected.filter(q=>q.difficulty===difficulty);
      const replacements=groups[difficulty].filter(q=>
        isImage(q) && !selected.includes(q)
      );

      for(const replacement of replacements){
        if(imageCount>=2) break;

        const position=selected.findIndex(q=>
          q.difficulty===difficulty && !isImage(q)
        );

        if(position!==-1){
          selected[position]=replacement;
          imageCount++;
        }
      }
    }
  }

  if(imageCount>2){
    let extra=imageCount-2;
    for(const difficulty of ["easy","medium","hard"]){
      const replacements=groups[difficulty].filter(q=>
        !isImage(q) && !selected.includes(q)
      );

      for(const replacement of replacements){
        if(extra<=0) break;

        const position=selected.findIndex(q=>
          q.difficulty===difficulty && isImage(q)
        );

        if(position!==-1){
          selected[position]=replacement;
          extra--;
        }
      }
    }
  }

  return shuffle(selected);
}

function startGame(){
  clearInterval(timer);

  if(bank.length<10){
    alert("Savollar hali yuklanmagan.");
    return;
  }

  questions=makeGameQuestions();
  index=0;
  score=0;

  document.getElementById("score").textContent=score;
  hideAll();
  document.getElementById("game").style.display="block";
  showQuestion();
}

function showQuestion(){
  answered=false;
  seconds=15;
  document.getElementById("time").textContent=seconds;
  document.getElementById("progress").textContent=(index+1)+" / 10";

  const q=questions[index];

  document.getElementById("level").textContent=
    "Daraja: "+(labels[q.difficulty] || q.difficulty);

  document.getElementById("question").textContent=q.question;
  document.getElementById("result").textContent="";
  document.getElementById("next").style.display="none";

  const picture=document.getElementById("questionImage");
  const url=imageUrl(q);

  if(isImage(q) && url){
    picture.src=url;
    picture.style.display="block";
  }else{
    picture.removeAttribute("src");
    picture.style.display="none";
  }

  const box=document.getElementById("answers");
  box.innerHTML="";

  q.options.forEach((answer,i)=>{
    const b=document.createElement("button");
    b.className="answer";
    b.textContent=answer;
    b.onclick=()=>checkAnswer(i);
    box.appendChild(b);
  });

  clearInterval(timer);
  timer=setInterval(()=>{
    seconds--;
    document.getElementById("time").textContent=seconds;
    if(seconds<=0) checkAnswer(-1);
  },1000);
}

function checkAnswer(choice){
  if(answered) return;

  answered=true;
  clearInterval(timer);

  const q=questions[index];
  const buttons=document.querySelectorAll(".answer");

  buttons.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer){
      b.style.background="#168d50";
    }else if(i===choice){
      b.style.background="#a33b3b";
    }
  });

  if(choice===q.answer){
    score+=10;
    document.getElementById("result").textContent="✅ To‘g‘ri! +10 ball";
  }else{
    document.getElementById("result").textContent=
      choice===-1 ? "⏰ Vaqt tugadi!" : "❌ Noto‘g‘ri javob!";
  }

  document.getElementById("score").textContent=score;
  document.getElementById("next").style.display="block";
  document.getElementById("next").textContent=
    index===9 ? "Natijani ko‘rish" : "Keyingi savol ➜";
}

function nextQuestion(){
  index++;
  if(index>=10){
    finishGame();
    return;
  }
  showQuestion();
}

async function finishGame(){
  clearInterval(timer);
  hideAll();

  document.getElementById("finish").style.display="block";
  document.getElementById("finalScore").textContent=score+" ball";

  const status=document.getElementById("saveStatus");
  status.textContent="Natija saqlanmoqda...";

  try{
    if(!tg.initData) throw new Error("Telegram ichida oching");

    const response=await fetch("/api/score",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        initData:tg.initData,
        score:score
      })
    });

    if(!response.ok) throw new Error("Saqlash amalga oshmadi");

    status.textContent="✅ Natijangiz reytingga saqlandi!";
  }catch(error){
    status.textContent="⚠️ Natijani saqlab bo‘lmadi. Telegram ichida qayta urinib ko‘ring.";
  }
}

async function showLeaderboard(){
  hideAll();
  document.getElementById("leaderboard").style.display="block";
  await loadBoard("all");
}

async function loadBoard(period){
  ["all","day","week"].forEach(p=>{
    document.getElementById(p+"Tab").classList.toggle("active",p===period);
  });

  const box=document.getElementById("players");
  box.textContent="Yuklanmoqda...";

  try{
    const response=await fetch("/api/leaderboard?period="+period);
    if(!response.ok) throw new Error();

    const data=await response.json();
    box.innerHTML="";

    if(!data.players || !data.players.length){
      box.textContent="Hozircha reytingda o‘yinchilar yo‘q.";
      return;
    }

    data.players.forEach(p=>{
      const div=document.createElement("div");
      div.className="player";

      const name=document.createElement("span");
      name.textContent=p.rank+". "+p.name;

      const points=document.createElement("b");
      points.textContent=p.score+" ball";

      div.append(name,points);
      box.appendChild(div);
    });
  }catch(error){
    box.textContent="Reytingni yuklab bo‘lmadi.";
  }
}

loadQuestions();
</script>
</body>
</html>
